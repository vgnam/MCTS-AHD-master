defaults:
  - _self_
  - problem: cvrp_aco
  - llm_client: gemini
  - override hydra/output: local

hydra:
  job:
    chdir: True
  run:
    dir: outputs/${problem.problem_name}-${problem.problem_type}/${algorithm}/${now:%Y-%m-%d_%H-%M-%S}

model: mistral/codestral-2508 # Paper model via the Mistral API
temperature: 1  # temperature for chat completion

# === LLM Advisor Configuration (list of advisor LLMs) ===
llm_advisor:
  enabled: true  # Toggle debate mechanism on/off
  debate_rounds: 3  # Number of debate rounds
  list:  # List of advisor LLMs
    - api_endpoint: "https://integrate.api.nvidia.com/v1/chat/completions"
      api_key: "Not used"
      model: "nvidia_nim/deepseek-ai/deepseek-v3.1"
      name: "DeepSeek"
      role: "Advanced Reasoning Specialist"
      expertise: "complex problem solving, logical reasoning, and strategic heuristic design"
    - api_endpoint: "https://integrate.api.nvidia.com/v1/chat/completions"
      api_key: "Not used"
      model: "nvidia_nim/qwen/qwen3-coder-480b-a35b-instruct"
      name: "Qwen3-Coder"
      role: "Code Optimization Expert"
      expertise: "code generation, refactoring, and optimization for heuristic algorithms"
    - api_endpoint: "https://integrate.api.nvidia.com/v1/chat/completions"
      api_key: "Not used"
      model: "mistral/codestral-latest"
      name: "Codestral"
      role: "Code Generation Specialist"
      expertise: "generating efficient and robust code implementations for heuristics"

# The chosen algorithm
algorithm: ab-mcts-ahd

# === Ablation switches for ab-mcts-ahd (all true = full GENESIS) ===
# e.g. python main.py ablation.global_sharing=false
ablation:
  posterior_sampling: true     # false: deterministic UCB on posterior means instead of Thompson sampling
  adaptive_op_selection: true  # false: operator drawn uniformly at random once expansion is chosen
  global_sharing: true         # false: GEN nodes use a fixed prior, no global hyper-posterior
  ucb_c: 1.0                   # exploration constant, only used when posterior_sampling=false
  agre: true                   # false: skip the AGRE refinement step entirely
  agre_stages:                 # individual AGRE stages (only used when agre=true)
    counterfactual: true
    role_conflict: true
    abstraction: true
    assumption_repair: true

# Main GA loop parameters
max_fe: ${oc.select:problem.max_fe,500} # Constructive tasks override to 1000
candidates_per_expansion: 4 # N candidates, followed by at most one AGRE evaluation
search_timeout: 60 # Whole search, including LLM calls and evaluations; null disables
seed: 2024 # Override for each independent run
pop_size: 30 # population size for GA
init_pop_size: 5 # initial population size for GA
timeout: 60 # timeout for evaluation of a single heuristic
